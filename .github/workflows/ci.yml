name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Quality checks and linting
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Check compilation
      run: cargo check --all-targets --all-features

  # Comprehensive testing across platforms
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: nightly

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-

    - name: Run tests
      run: cargo test --all-features -- --nocapture

    - name: Generate coverage (Ubuntu only)
      if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
      run: |
        cargo install cargo-tarpaulin
        cargo tarpaulin --out Xml --output-dir coverage

    - name: Upload coverage to Codecov (Ubuntu only)
      if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
      uses: codecov/codecov-action@v3
      with:
        file: coverage/cobertura.xml
        flags: unittests
        name: codecov-umbrella

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

  # HEE Security scanning
  hee-security:
    name: HEE Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run HEE Security Scanner
      run: python scripts/security_scanner.py --directory . --output-format json --output-file security-report.json

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: hee-security-report
        path: security-report.json

    - name: Check security scan results
      run: |
        if [ -f security-report.json ]; then
          # If the file exists and has content, it means there were security issues
          if [ -s security-report.json ] && [ "$(cat security-report.json)" != "[]" ]; then
            echo "❌ Security issues found!"
            cat security-report.json
            exit 1
          else
            echo "✅ No security issues found"
          fi
        else
          echo "⚠️ Security report not generated"
          exit 1
        fi

  # HEE Recipe validation
  hee-recipe-validation:
    name: HEE Recipe Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Validate HEE Recipe Security
      run: |
        # Test recipe validation with Python security validator
        python -c "
        from scripts.security_validator import validate_recipe
        
        # Define expected results
        valid_recipes = [
            '{\"shape\": \"circle\", \"size\": \"256x256\"}',  # Valid
        ]
        invalid_recipes = [
            '{\"size\": \"256x256\"}',  # Invalid - missing shape
            '{\"shape\": \"circle\", \"size\": \"256x256\"}\u200B',  # Invalid - zero width char
        ]
        
        all_recipes = valid_recipes + invalid_recipes
        
        validation_errors = []
        for recipe in all_recipes:
            result = validate_recipe(recipe)
            is_valid = recipe in valid_recipes
            
            print(f'Recipe: {repr(recipe[:50])}... Valid: {result} (Expected: {is_valid})')
            
            # Check if validation result matches expectation
            if result != is_valid:
                validation_errors.append(f'Recipe {repr(recipe[:30])}...: got {result}, expected {is_valid}')
        
        if validation_errors:
            print('❌ Validation logic errors found:')
            for error in validation_errors:
                print(f'  - {error}')
            exit(1)
        else:
            print('✅ All recipes passed validation')
        "

  # Performance benchmarking (future)
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

    - name: Run benchmarks
      run: cargo bench

  # Release build validation
  release:
    name: Release Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Test release binary
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          ./target/${{ matrix.target }}/release/logo-render.exe --help
        else
          ./target/${{ matrix.target }}/release/logo-render --help
        fi

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: logo-render-${{ matrix.name }}
        path: target/${{ matrix.target }}/release/logo-render*

  # Pre-commit validation
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache pre-commit
      uses: actions/cache@v3
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Run pre-commit hooks
      run: pre-commit run --all-files --show-diff-on-failure

  # Dependency license checking
  licenses:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-license
      run: cargo install cargo-license

    - name: Check dependency licenses
      run: cargo license --json | jq -e 'all(.license; . == "MIT" or . == "Apache-2.0" or . == "BSD-3-Clause" or . == "ISC")'

  # Documentation validation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Check documentation
      run: cargo doc --no-deps --document-private-items

    - name: Check README examples
      run: |
        # Future: validate README examples compile and run
        echo "README validation placeholder"
