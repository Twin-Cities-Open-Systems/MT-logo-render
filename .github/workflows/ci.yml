name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/phase3-core-implementation ]
  pull_request:
    branches: [ main, feature/phase3-core-implementation ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Quality checks and linting
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Check compilation
      run: cargo check --all-targets --all-features

  # Comprehensive testing across platforms
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: nightly

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-

    - name: Run tests
      run: cargo test --all-features -- --nocapture

    - name: Generate coverage (Ubuntu only)
      if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
      run: |
        cargo install cargo-tarpaulin
        cargo tarpaulin --out Xml --output-dir coverage

    - name: Upload coverage to Codecov (Ubuntu only)
      if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
      uses: codecov/codecov-action@v3
      with:
        file: coverage/cobertura.xml
        flags: unittests
        name: codecov-umbrella

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

  # Repo-local Unicode/homoglyph attack detection.
  #
  # RENAMED 2026-08-31. This was "hee-security" / "HEE Security Scan", which
  # claimed org-tooling provenance it does not have: it runs
  # scripts/security_scanner.py, a file local to this repo, forked from
  # tick-task's and since diverged to nearly double the size. Three files
  # named security_scanner.py exist across the org, doing two different
  # jobs. See human-execution-engine#468 for the consolidation.
  #
  # A job name that implies org tooling is enforcing something, when it is
  # not, is worse than no name at all.
  unicode-scan:
    name: Unicode Attack Scan (repo-local)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Unicode attack scanner (repo-local script)
      run: python scripts/security_scanner.py --directory . --output-format json --output-file security-report.json

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: unicode-scan-report
        path: security-report.json

    - name: Check security scan results
      run: |
        if [ -f security-report.json ]; then
          # If the file exists and has content, it means there were security issues
          if [ -s security-report.json ] && [ "$(cat security-report.json)" != "[]" ]; then
            echo "❌ Security issues found!"
            cat security-report.json
            exit 1
          else
            echo "✅ No security issues found"
          fi
        else
          echo "⚠️ Security report not generated"
          exit 1
        fi

  # Repo-local recipe validation. Renamed 2026-08-31 for the same reason as
  # unicode-scan above: it runs scripts/security_validator.py from this
  # repo, not org tooling.
  recipe-validation:
    name: Recipe Validation (repo-local)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Validate recipe security (repo-local script)
      run: |
        # Test recipe validation with Python security validator
        python -c "
        from scripts.security_validator import validate_recipe

        # Define expected results
        valid_recipes = [
            '{\"shape\": \"circle\", \"size\": \"256x256\"}',  # Valid
        ]
        invalid_recipes = [
            '{\"size\": \"256x256\"}',  # Invalid - missing shape
            '{\"shape\": \"circle\", \"size\": \"256x256\"}\u200B',  # Invalid - zero width char
        ]

        all_recipes = valid_recipes + invalid_recipes

        validation_errors = []
        for recipe in all_recipes:
            result = validate_recipe(recipe)
            is_valid = recipe in valid_recipes

            print(f'Recipe: {repr(recipe[:50])}... Valid: {result} (Expected: {is_valid})')

            # Check if validation result matches expectation
            if result != is_valid:
                validation_errors.append(f'Recipe {repr(recipe[:30])}...: got {result}, expected {is_valid}')

        if validation_errors:
            print('❌ Validation logic errors found:')
            for error in validation_errors:
                print(f'  - {error}')
            import sys; sys.exit(1)
        else:
            print('✅ All recipes passed validation')
        "

  # Performance benchmarking (future)
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

    - name: Run benchmarks
      run: cargo bench

  # Release build validation
  release:
    name: Release Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Test release binary
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ./target/${{ matrix.target }}/release/logo-render.exe --help
        else
          ./target/${{ matrix.target }}/release/logo-render --help
        fi
      shell: bash

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: logo-render-${{ matrix.name }}
        path: target/${{ matrix.target }}/release/logo-render*

  # Pre-commit validation
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Set up SSH for GitHub
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        # Configure SSH to use the GitHub Actions token
        echo "Host github.com" >> ~/.ssh/config
        echo "  IdentityFile ~/.ssh/id_rsa" >> ~/.ssh.config
        echo "  IdentitiesOnly yes" >> ~/.ssh/config

    - name: Cache pre-commit
      uses: actions/cache@v3
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Run pre-commit hooks
      run: pre-commit run --all-files --show-diff-on-failure

  # Dependency license checking
  licenses:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-license
      run: cargo install cargo-license

    - name: Check dependency licenses
      run: cargo license --json | jq -e 'all(.[]; .license | test("^(MIT|Apache-2.0|BSD-3-Clause|ISC|0BSD|Unlicense|Zlib|BSD-2-Clause|BSL-1.0|LGPL-2.1-or-later|Unicode-3.0|Apache-2.0 WITH LLVM-exception)( OR (MIT|Apache-2.0|BSD-3-Clause|ISC|0BSD|Unlicense|Zlib|BSD-2-Clause|BSL-1.0|LGPL-2.1-or-later|Unicode-3.0|Apache-2.0 WITH LLVM-exception))*$") or test("^\\(Apache-2.0 OR MIT\\) AND Unicode-3.0$"))'

  # Documentation validation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Check documentation
      run: cargo doc --no-deps --document-private-items

    - name: Check README examples
      run: |
        # Future: validate README examples compile and run
        echo "README validation placeholder"

  # Genuinely org tooling, unlike the jobs above: hee-check is checked out
  # from human-execution-engine and run against this repo. Catches broken
  # file references in docs and hardcoded /home/<user>/ paths, neither of
  # which any Rust-specific check looks for.
  #
  # This is the pattern .github already uses to run hee-view: check out the
  # tool's home repo rather than vendoring a copy. Vendoring is what
  # produced the three divergent scanners in the first place.
  hee-check:
    name: hee-check (org tooling)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: MT-logo-render

    - name: Checkout human-execution-engine (hee-check lives there)
      uses: actions/checkout@v4
      with:
        repository: Twin-Cities-Open-Systems/human-execution-engine
        path: human-execution-engine

    # REPORTING ONLY FOR NOW, and this is a deliberate, temporary state with
    # a ticket behind it -- not an advisory check left to rot.
    #
    # This comment's own diagnosis, written when the check landed, was right:
    #
    #   12 committed .cursor/ files (derived editor state, and the org does
    #      not use Cursor)
    #   ~285 broken file references, of which only ~23 are this repo's own --
    #      the rest are in committed .cursor/prompts and in prompts/hee/,
    #      a vendored and now-diverged copy of human-execution-engine's docs
    #
    # All of that is gone as of this commit. Both trees are deleted:
    # governance already reaches this repo through the dotfiles SessionStart
    # hook, so the vendored copy was redundant AND contradictory -- it held
    # prompts upstream purged in 68fd689, and copies of four documents
    # deleted upstream today for describing software never built.
    #
    #   broken references   317 -> 28, and all 28 are this repo's own
    #   committed .cursor    12 -> 0
    #
    # STILL REPORTING ONLY, for a smaller and more honest reason: 28 real
    # findings remain in this repo's own docs -- docs/CLI_CONTRACT.md (10),
    # TASK_NEXT.md (7), docs/CI_MONITORING_SPEC.md (3) and others reference
    # files that are not here. Turning red on day one is the failure
    # fleet-ops#350 is about.
    #
    # FLIP continue-on-error OFF when those 28 reach zero. #469 landed.
    - name: Boundary + reference checks
      continue-on-error: true
      run: |
        human-execution-engine/tooling/bin/hee-check all MT-logo-render
