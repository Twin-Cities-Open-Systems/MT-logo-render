name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install requests pyyaml
          python -c "import yaml, requests; print('Dependencies installed successfully')"

      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building MT-logo-render v$VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          python scripts/generate_changelog.py --version ${{ steps.get_version.outputs.version }} --output changelog.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: MT-logo-render ${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  build-release:
    name: Build Release Binaries
    needs: release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            BINARY_NAME="logo-render.exe"
            BINARY_PATH="target/${{ matrix.target }}/release/logo-render.exe"
          else
            BINARY_NAME="logo-render"
            BINARY_PATH="target/${{ matrix.target }}/release/logo-render"
          fi
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV
          echo "BINARY_PATH=$BINARY_PATH" >> $GITHUB_ENV

      - name: Package binary
        run: |
          ARCHIVE_NAME="mt-logo-render-${{ needs.release.outputs.version }}-${{ matrix.name }}"
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a "$ARCHIVE_NAME.zip" "$BINARY_PATH"
            ARCHIVE_PATH="$ARCHIVE_NAME.zip"
          else
            tar -czf "$ARCHIVE_NAME.tar.gz" -C "$(dirname "$BINARY_PATH")" "$(basename "$BINARY_PATH")"
            ARCHIVE_PATH="$ARCHIVE_NAME.tar.gz"
          fi
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV

      - name: Upload binary to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ${{ env.ARCHIVE_PATH }}
          asset_name: ${{ env.ARCHIVE_PATH }}
          asset_content_type: application/octet-stream

  update-changelog:
    name: Update Changelog
    needs: [release, build-release]
    runs-on: ubuntu-latest
    if: "!contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        run: |
          python scripts/update_changelog.py --version ${{ needs.release.outputs.version }}

      - name: Commit changelog update
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "docs: Update changelog for v${{ needs.release.outputs.version }}" || echo "No changes to commit"
          git push

  notify-hee-platform:
    name: Notify HEE Platform
    needs: [release, build-release, update-changelog]
    runs-on: ubuntu-latest
    if: "!contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')"

    steps:
      - name: Send release notification
        run: |
          # This could be extended to notify HEE platform maintainers
          # For now, we'll just log the release
          echo "MT-logo-render v${{ needs.release.outputs.version }} has been released!"
          echo "Release URL: https://github.com/spencerbutler/MT-logo-render/releases/tag/${{ github.ref }}"
          echo "Please coordinate with HEE platform maintainers for ecosystem integration."
