# Pre-commit hooks for MT-logo-render Rust project
# Ensures code quality and consistency before commits

repos:
  # Rust formatting and linting (using local cargo tools - GitHub only)
  # Note: These hooks require Rust/Cargo to be installed
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        description: Format Rust code with cargo fmt
        entry: bash -c "command -v cargo >/dev/null 2>&1 && cargo fmt -- --check --verbose || echo 'cargo not found, skipping rustfmt'"
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: clippy
        description: Lint Rust code with cargo clippy
        entry: bash -c "command -v cargo >/dev/null 2>&1 && cargo clippy --all-targets --all-features -- -D warnings || echo 'cargo not found, skipping clippy'"
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo-check
        description: Check Rust code compilation with cargo
        entry: bash -c "command -v cargo >/dev/null 2>&1 && cargo check --all-targets --all-features || echo 'cargo not found, skipping cargo-check'"
        language: system
        types: [rust]
        pass_filenames: false
        files: Cargo.toml

  # General code quality
  - repo: git@github.com:pre-commit/pre-commit-hooks.git
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Remove trailing whitespace from all files

      - id: end-of-file-fixer
        name: Fix end of files
        description: Ensure files end with a newline

      - id: check-yaml
        name: Check YAML syntax
        description: Validate YAML file syntax
        files: \.(yaml|yml)$

      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Prevent committing merge conflict markers

      - id: check-added-large-files
        name: Check for large files
        description: Prevent committing large files
        args: ['--maxkb=500']

  # Markdown formatting
  - repo: git@github.com:executablebooks/mdformat.git
    rev: 0.7.19
    hooks:
      - id: mdformat
        name: Format Markdown
        description: Format Markdown files consistently
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
          - mdformat-footnote

  # Documentation organization validation
  - repo: local
    hooks:
      - id: validate-doc-organization
        name: Validate Documentation Organization
        description: Ensure agent docs are in prompts/ and human docs are in docs/
        entry: bash -c "./scripts/validate_doc_organization.sh"
        language: system
        types: [markdown, text]
        pass_filenames: false
        always_run: true
        stages: [commit, push]

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
